<style>

.pulse-red { animation: pulse-red 1.5s infinite; }
.card { background: rgba(11,15,25,0.85); backdrop-filter: blur(10px); border: 1px solid rgba(0,240,255,0.2); border-radius: 20px; }
.btn-primary { background: linear-gradient(135deg, #00f0ff 0%, #00ff66 100%); color: #05050a; font-weight: 900; transition: all 0.2s; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,240,255,0.4); }

.input-field { background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1); color: #fff; border-radius: 14px; padding: 14px; width: 100%; transition: all 0.2s; }

.lang-btn { padding: 8px 12px; border-radius: 10px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s; cursor: pointer; }

.lang-btn:hover { background: rgba(255,255,255,0.1); }
#trackMap { height: 320px; border-radius: 16px; z-index: 1; }
.step-circle { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.3s; }
.step-circle.active { background: #00ff66; color: #05050a; box-shadow: 0 0 20px rgba(0,255,102,0.6); }
.step-circle.pending { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); }
.step-line { flex: 1; height: 3px; background: rgba(255,255,255,0.1); transition: all 0.3s; }

<script>

  en: { dir: 'ltr', appTitle: '🚀 CyberDelivery', appSubtitle: 'Track your order live', enterTracking: 'Enter tracking code:', search: '🔍 Search', status: 'Status', stepAccepted: 'Accepted', stepStore: 'At Store', stepTransit: 'In Transit', stepDelivered: 'Delivered', call: 'Call', customer: '👤 Customer:', address: '📍 Address:', amount: '💰 Amount:', restaurant: '🏪 Restaurant:', orderNotFound: 'Order not found', checkCode: 'Check tracking code and try again', shareTracking: 'Share Tracking', poweredBy: 'Powered by CyberDelivery', backToRestaurant: 'Back to Restaurant', copied: '📋 Link copied', shareError: '❌ Share failed', tracking: '🔍 Tracking...', orderStatus: { pending: '⏳ Pending', accepted: '✅ Accepted', at_store: '🏪 At Store', picked_up: '📦 Picked Up', in_transit: '🚗 On the way', delivered: '🎉 Delivered!', cancelled: '❌ Cancelled' } },
  ur: { dir: 'rtl', appTitle: '🚀 سائبر ڈیلیوری', appSubtitle: 'اپنا آرڈر براہ راست ٹریک کریں', enterTracking: 'ٹریکنگ کوڈ درج کریں:', search: '🔍 تلاش', status: 'حالت', stepAccepted: 'قبول', stepStore: 'دکان پر', stepTransit: 'راستے میں', stepDelivered: 'پہنچا دیا', call: 'کال', customer: '👤 گاہک:', address: '📍 پتہ:', amount: '💰 رقم:', restaurant: '🏪 ریسٹورنٹ:', orderNotFound: 'آرڈر نہیں ملا', checkCode: 'ٹریکنگ کوڈ چیک کریں', shareTracking: 'ٹریکنگ شیئر کریں', poweredBy: 'سائبر ڈیلیوری کی طرف سے', backToRestaurant: 'ریسٹورنٹ پر واپس', copied: '📋 کاپی ہو گیا', shareError: '❌ شیئر ناکام', tracking: '🔍 ٹریکنگ...', orderStatus: { pending: '⏳ زیر التواء', accepted: '✅ قبول', at_store: '🏪 دکان پر', picked_up: '📦 اٹھا لیا', in_transit: '🚗 راستے میں', delivered: '🎉 پہنچا دیا!', cancelled: '❌ منسوخ' } },
  bn: { dir: 'ltr', appTitle: '🚀 সাইবার ডেলিভারি', appSubtitle: 'আপনার অর্ডার লাইভ ট্র্যাক করুন', enterTracking: 'ট্র্যাকিং কোড দিন:', search: '🔍 খুঁজুন', status: 'অবস্থা', stepAccepted: 'গৃহীত', stepStore: 'দোকানে', stepTransit: 'পথে', stepDelivered: 'পৌঁছে', call: 'কল', customer: '👤 গ্রাহক:', address: '📍 ঠিকানা:', amount: '💰 পরিমাণ:', restaurant: '🏪 রেস্তোরাঁ:', orderNotFound: 'অর্ডার পাওয়া যায়নি', checkCode: 'ট্র্যাকিং কোড যাচাই করুন', shareTracking: 'ট্র্যাকিং শেয়ার', poweredBy: 'সাইবার ডেলিভারি দ্বারা', backToRestaurant: 'রেস্তোরাঁয় ফিরে', copied: '📋 কপি', shareError: '❌ শেয়ার ব্যর্থ', tracking: '🔍 ট্র্যাকিং...', orderStatus: { pending: '⏳ অপেক্ষমাণ', accepted: '✅ গৃহীত', at_store: '🏪 দোকানে', picked_up: '📦 নেওয়া', in_transit: '🚗 পথে', delivered: '🎉 পৌঁছে!', cancelled: '❌ বাতিল' } },
  hi: { dir: 'ltr', appTitle: '🚀 साइबर डिलीवरी', appSubtitle: 'अपना ऑर्डर लाइव ट्रैक करें', enterTracking: 'ट्रैकिंग कोड दर्ज करें:', search: '🔍 खोजें', status: 'स्थिति', stepAccepted: 'स्वीकृत', stepStore: 'दुकान पर', stepTransit: 'रास्ते में', stepDelivered: 'पहुँचा', call: 'कॉल', customer: '👤 ग्राहक:', address: '📍 पता:', amount: '💰 राशि:', restaurant: '🏪 रेस्तरां:', orderNotFound: 'ऑर्डर नहीं मिला', checkCode: 'ट्रैकिंग कोड जांचें', shareTracking: 'ट्रैकिंग शेयर', poweredBy: 'साइबर डिलीवरी द्वारा', backToRestaurant: 'रेस्तरां पर वापस', copied: '📋 कॉपी', shareError: '❌ शेयर विफल', tracking: '🔍 ट्रैकिंग...', orderStatus: { pending: '⏳ लंबित', accepted: '✅ स्वीकृत', at_store: '🏪 दुकान पर', picked_up: '📦 ले लिया', in_transit: '🚗 रास्ते में', delivered: '🎉 पहुँचा!', cancelled: '❌ रद्द' } }
};

let currentLang = localStorage.getItem('cyberLang') || 'ar';
let trackMap = null;
let driverMarker = null;
let destMarker = null;
let routeLine = null;
let currentOrder = null;
let refreshInterval = null;

function t(key) {
  const lang = I18N[currentLang];
  if (!lang) return key;
  const keys = key.split('.');
  let val = lang;
  for (const k of keys) { if (val && typeof val === 'object') val = val[k]; else return key; }
  return val || key;
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('cyberLang', lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = I18N[lang].dir;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (typeof val === 'string') el.textContent = val;
  });
  document.querySelectorAll('.lang-btn').forEach(btn => { btn.classList.toggle('active', btn.getAttribute('data-lang') === lang); });
  if (currentOrder) renderOrderStatus(currentOrder);
}

function showToast(msg, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(-50%) translateY(-20px)'; setTimeout(() => toast.remove(), 300); }, 3000);
}

async function trackOrder() {
  const code = document.getElementById('trackCode').value.trim();
  if (!code) { showToast(t('checkCode'), 'error'); return; }

  document.getElementById('trackError').classList.add('hidden');
  document.getElementById('orderStatus').classList.add('hidden');
  document.getElementById('shareBtn').classList.add('hidden');

  const { data: order, error } = await db.from('orders').select('*').eq('tracking_code', code).single();

  if (error || !order) {
    document.getElementById('trackError').classList.remove('hidden');
    return;
  }

  currentOrder = order;
  document.getElementById('orderStatus').classList.remove('hidden');
  document.getElementById('shareBtn').classList.remove('hidden');

  renderOrderStatus(order);
  initMap(order);

  if (order.status !== 'delivered' && order.status !== 'cancelled') {
    if (refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(() => trackOrder(), 5000);
  } else {
    if (refreshInterval) clearInterval(refreshInterval);
  }
}

function renderOrderStatus(order) {
  const statusLabel = t('orderStatus.' + order.status) || order.status;
  document.getElementById('statusText').textContent = statusLabel;

  const statusIcons = { pending: '⏳', accepted: '✅', at_store: '🏪', picked_up: '📦', in_transit: '🚗', delivered: '🎉', cancelled: '❌' };
  document.getElementById('statusIcon').textContent = statusIcons[order.status] || '⏳';

  const statusSteps = { pending: 0, accepted: 1, at_store: 2, picked_up: 3, in_transit: 3, delivered: 4, cancelled: 0 };
  const currentStep = statusSteps[order.status] || 0;

  for (let i = 1; i <= 4; i++) {
    const circle = document.getElementById('step' + i);
    if (i <= currentStep) {
      circle.className = 'step-circle active pulse-green';
    } else {
      circle.className = 'step-circle pending';
    }
    if (i < 4) {
      const line = document.getElementById('line' + i);
      line.className = i < currentStep ? 'step-line active' : 'step-line';
    }
  }

  if (order.status === 'cancelled') {
    document.getElementById('statusText').classList.remove('neon-green');
    document.getElementById('statusText').classList.add('neon-pink');
  } else {
    document.getElementById('statusText').classList.remove('neon-pink');
    document.getElementById('statusText').classList.add('neon-green');
  }

  document.getElementById('customerName').textContent = order.customer_name || '---';
  document.getElementById('customerAddress').textContent = order.address || '---';
  const total = (parseFloat(order.price) || 0) + (parseFloat(order.delivery_fee) || 0);
  document.getElementById('orderAmount').textContent = total.toFixed(2) + ' ر.س';
  document.getElementById('restaurantName').textContent = order.restaurant_name || '---';

  if (order.driver_name) {
    document.getElementById('driverInfo').classList.remove('hidden');
    document.getElementById('driverName').textContent = order.driver_name;
    document.getElementById('driverPhone').textContent = order.driver_phone || '';
    if (order.driver_phone) {
      document.getElementById('callDriver').href = 'tel:' + order.driver_phone;
      document.getElementById('callDriver').classList.remove('hidden');
    } else {
      document.getElementById('callDriver').classList.add('hidden');
    }
  } else {
    document.getElementById('driverInfo').classList.add('hidden');
  }

  if (trackMap && order.customer_lat && order.customer_lng) {
    updateMap(order);
  }
}

function initMap(order) {
  const lat = order.customer_lat || 24.7136;
  const lng = order.customer_lng || 46.6753;

  if (!trackMap) {
    trackMap = L.map('trackMap').setView([lat, lng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OSM' }).addTo(trackMap);
    setTimeout(() => trackMap.invalidateSize(), 200);
  }

  updateMap(order);
}

function updateMap(order) {
  const lat = order.customer_lat || 24.7136;
  const lng = order.customer_lng || 46.6753;

  if (destMarker) trackMap.removeLayer(destMarker);
  if (driverMarker) trackMap.removeLayer(driverMarker);
  if (routeLine) trackMap.removeLayer(routeLine);

  const destIcon = L.divIcon({ html: '<div style="width:24px;height:24px;background:#ff0055;border:3px solid white;border-radius:50%;box-shadow:0 0 15px #ff0055"></div>', iconSize: [24, 24], className: '' });
  destMarker = L.marker([lat, lng], { icon: destIcon }).addTo(trackMap).bindPopup('📍 ' + (order.address || ''));

  if (order.driver_lat && order.driver_lng) {
    const driverIcon = L.divIcon({ html: '<div style="width:24px;height:24px;background:#00ff66;border:3px solid white;border-radius:50%;box-shadow:0 0 15px #00ff66"></div>', iconSize: [24, 24], className: '' });
    driverMarker = L.marker([order.driver_lat, order.driver_lng], { icon: driverIcon }).addTo(trackMap).bindPopup('🚗 ' + (order.driver_name || ''));
    routeLine = L.polyline([[order.driver_lat, order.driver_lng], [lat, lng]], { color: '#00f0ff', weight: 3, opacity: 0.7, dashArray: '8, 8' }).addTo(trackMap);
    trackMap.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
  } else {
    trackMap.setView([lat, lng], 15);
  }
}

function shareTracking() {
  const code = document.getElementById('trackCode').value.trim();
  if (!code) return;
  const baseUrl = window.location.origin + window.location.pathname;
  const url = baseUrl + '?order=' + code;
  const text = `${t('appTitle')} - ${code}`;
  if (navigator.share) {
    navigator.share({ title: 'CyberDelivery', text, url }).catch(() => {
      navigator.clipboard.writeText(url).then(() => showToast(t('copied')));
    });
  } else {
    navigator.clipboard.writeText(url).then(() => showToast(t('copied'))).catch(() => showToast(t('shareError'), 'error'));
  }
}

window.addEventListener('DOMContentLoaded', () => {
  setLang(currentLang);
  const urlParams = new URLSearchParams(window.location.search);
  const codeFromUrl = urlParams.get('order');
  if (codeFromUrl) {
    document.getElementById('trackCode').value = codeFromUrl;
    trackOrder();
  }
});
</script>
</body>

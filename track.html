<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberDelivery - تتبع الطلب</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .neon-border { box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); border: 1px solid #06b6d4; }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center">
  <div class="w-full max-w-md bg-slate-900 neon-border rounded-2xl p-6 shadow-2xl text-center">
    <h1 class="text-2xl font-bold text-cyan-400 mb-2">📦 تتبع طلبك الفوري</h1>
    <p id="trackingCodeDisplay" class="text-sm text-slate-400 mb-6">جاري جلب تفاصيل الطلب...</p>

    <!-- تفاصيل الطلب -->
    <div id="orderDetails" class="bg-slate-800 border border-slate-700 rounded-xl p-4 mb-6 text-right space-y-3">
      <div class="flex justify-between">
        <span class="text-slate-400">حالة الطلب:</span>
        <span id="orderStatus" class="font-bold text-yellow-400">قيد المعالجة</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-400">اسم العميل:</span>
        <span id="customerName" class="font-semibold text-white">-</span>
      </div>
      <div class="flex justify-between">
        <span class="text-slate-400">المبلغ الإجمالي:</span>
        <span id="orderPrice" class="font-bold text-cyan-400">-</span>
      </div>
    </div>

    <!-- أزرار التواصل السريع مع المندوب عبدالله -->
    <div class="space-y-3">
      <a id="callDriverBtn" href="tel:0571835254" class="block w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition-all shadow-lg shadow-green-600/30">
        📞 اتصال بالمندوب (عبدالله)
      </a>
      <a id="whatsappDriverBtn" href="https://wa.me/966571835254" target="_blank" class="block w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-3 rounded-lg transition-all">
        💬 مراسلة عبر واتساب
      </a>
      <a href="index.html" class="block w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-lg text-sm transition-all">
        ← طلب جديد
      </a>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    async function loadTracking() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');

      if (!code) {
        document.getElementById('trackingCodeDisplay').innerText = 'لم يتم تحديد كود التتبع';
        return;
      }

      document.getElementById('trackingCodeDisplay').innerText = `كود الطلب: ${code}`;

      if (!db) return;
      const { data, error } = await db.from('orders').select('*').eq('tracking_code', code).single();

      if (error || !data) {
        document.getElementById('orderDetails').innerHTML = '<div class="text-red-400 text-center">عذراً، لم يتم العثور على هذا الطلب</div>';
        return;
      }

      document.getElementById('orderStatus').innerText = data.status;
      document.getElementById('customerName').innerText = data.customer_name;
      document.getElementById('orderPrice').innerText = data.price + ' ر.س';
    }

    loadTracking();
    // تحديث كل 5 ثوانٍ لمتابعة حالة التوصيل مباشرة
    setInterval(loadTracking, 5000);
  </script>
</body>
</html>

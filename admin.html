<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberDelivery - غرفة العمليات (الإدارة)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .neon-border { box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); border: 1px solid #06b6d4; }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">
  <div class="w-full max-w-4xl">
    <!-- هيدر الإدارة -->
    <div class="bg-slate-900 neon-border rounded-2xl p-6 mb-6 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-cyan-400">⚡ غرفة عمليات سايبر توصيل</h1>
        <p class="text-sm text-slate-400 mt-1">مراقبة وإدارة جميع طلبات سوق الرياض لحظة بلحظة</p>
      </div>
      <a href="index.html" class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition-all">
        + طلب جديد
      </a>
    </div>

    <!-- جدول الطلبات والتحكم -->
    <div class="bg-slate-900 neon-border rounded-2xl p-6 overflow-x-auto">
      <h2 class="text-lg font-semibold text-cyan-300 mb-4 border-b border-slate-800 pb-2">سجل الطلبات والعمليات</h2>
      <table class="w-full text-right text-sm">
        <thead>
          <tr class="text-slate-400 border-b border-slate-800">
            <th class="pb-3">كود الطلب</th>
            <th class="pb-3">العميل</th>
            <th class="pb-3">العنوان</th>
            <th class="pb-3">المبلغ</th>
            <th class="pb-3">الحالة</th>
            <th class="pb-3">الإجراء</th>
          </tr>
        </thead>
        <tbody id="adminOrdersList">
          <tr>
            <td colspan="6" class="text-center text-slate-500 py-6">جاري تحميل السجل...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    async function loadAdminOrders() {
      if (!db) return;
      const { data, error } = await db.from('orders').select('*').order('created_at', { ascending: false });

      const tbody = document.getElementById('adminOrdersList');
      if (error) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-red-400 text-center py-4">خطأ في التحميل: ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-slate-500 py-6">لا توجد طلبات مسجلة حالياً</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(order => `
        <tr class="border-b border-slate-800 hover:bg-slate-800/50 transition-all">
          <td class="py-3 font-mono text-cyan-400">${order.tracking_code}</td>
          <td class="py-3 font-semibold">${order.customer_name}</td>
          <td class="py-3 text-slate-300 text-xs">${order.address}</td>
          <td class="py-3 font-bold text-cyan-300">${order.price} ر.س</td>
          <td class="py-3"><span class="bg-slate-800 border border-slate-700 px-2 py-1 rounded text-xs text-yellow-400">${order.status}</span></td>
          <td class="py-3">
            <button onclick="deleteOrder('${order.id}')" class="bg-red-600/80 hover:bg-red-600 text-white px-3 py-1 rounded text-xs transition-all">حذف</button>
          </td>
        </tr>
      `).join('');
    }

    async function deleteOrder(id) {
      if (!confirm('هل أنت متأكد من حذف هذا الطلب؟')) return;
      const { error } = await db.from('orders').delete().eq('id', id);
      if (error) {
        alert('فشل الحذف: ' + error.message);
      } else {
        loadAdminOrders();
      }
    }

    // تحديث حي تلقائي
    setInterval(loadAdminOrders, 5000);
    loadAdminOrders();
  </script>
</body>
</html>

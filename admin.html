<!-- 📋 لوحة إدارة المندوبين السريعة -->
<div class="card p-4 bg-slate-900 border border-slate-800 rounded-xl mb-4">
    <h3 class="text-white font-bold mb-3">⚡ لوحة المشرف السريعة</h3>
    
    <div class="space-y-3 mb-3">
        <input type="text" id="workerName" placeholder="اسم العامل" class="w-full p-3 bg-slate-800 text-white rounded-lg border border-slate-700 focus:outline-none focus:border-green-500">
        <input type="text" id="adminPhone" placeholder="رقم جوالك لاستلام الإشعار (9665xxxxxxxx)" class="w-full p-3 bg-slate-800 text-white rounded-lg border border-slate-700 focus:outline-none focus:border-green-500">
        <input type="text" id="workerIban" placeholder="رقم الحساب البنكي IBAN (مطلوب)" class="w-full p-3 bg-slate-800 text-white rounded-lg border border-slate-700 focus:outline-none focus:border-green-500">
    </div>

    <button onclick="sendAdminNotice()" class="w-full py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded-lg transition duration-200">
        🚀 إرسال بيانات المندوب والإيبان لجوالي
    </button>
</div>

<script>
    function sendAdminNotice() {
        const name = document.getElementById('workerName').value.trim();
        const phone = document.getElementById('adminPhone').value.trim();
        const iban = document.getElementById('workerIban').value.trim();

        // فحص سريع: إذا كان الأيبان أو الاسم ناقص ينبهك فوراً
        if (!name || !phone) {
            alert('يا أبو محمد، اسم العامل ورقم جوالك ضروريين!');
            return;
        }
        
        if (!iban) {
            alert('⚠️ تنبيه: حقل "الإيبان" ناقص! لازم تسجل رقم الحساب البنكي للعامل أولاً.');
            return;
        }

        const pin = Math.floor(1000 + Math.random() * 9000);
        const driverAppUrl = "https://mkhld0336-cmyk.github.io/Driving-/driver.html";

        let message = `📋 مـنـدوب جـديـد:\n👤 الاسم: ${name}\n💳 الإيبان: \`${iban}\`\n🔑 الـ PIN: *${pin}*\n🔗 الرابط:\n${driverAppUrl}`;

        const whatsappUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, '_blank');
    }
</script>

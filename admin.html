<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="bg-[#05050a] text-white p-4 font-sans max-w-5xl mx-auto">
  <h1 class="text-2xl font-black text-cyan-400 mb-6">🛡️ لوحة القيادة والإدارة</h1>
  
  <div class="grid grid-cols-3 gap-3 mb-6">
    <div class="bg-[#0b0f19] p-4 rounded-xl border border-gray-800 text-center">
      <div class="text-xs text-gray-400">إجمالي الطلبات</div>
      <div class="text-xl font-bold text-white mt-1" id="statTotal">0</div>
    </div>
    <div class="bg-[#0b0f19] p-4 rounded-xl border border-gray-800 text-center">
      <div class="text-xs text-gray-400">قيد الانتظار</div>
      <div class="text-xl font-bold text-yellow-400 mt-1" id="statPending">0</div>
    </div>
    <div class="bg-[#0b0f19] p-4 rounded-xl border border-gray-800 text-center">
      <div class="text-xs text-gray-400">المبيعات</div>
      <div class="text-xl font-bold text-cyan-400 mt-1" id="statRevenue">0 ر.س</div>
    </div>
  </div>

  <div class="bg-[#0b0f19] rounded-xl border border-gray-800 overflow-hidden">
    <div class="p-3 border-b border-gray-800 font-bold text-sm">سجل الطلبات الحية</div>
    <div class="overflow-x-auto">
      <table class="w-full text-xs text-right">
        <thead class="bg-black/50 text-gray-400">
          <tr>
            <th class="p-2">العميل</th>
            <th class="p-2">المبلغ</th>
            <th class="p-2">الحالة</th>
            <th class="p-2">التاريخ</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadStats() {
      const { data: orders } = await db.from('orders').select('*').order('created_at', { ascending: false });
      
      document.getElementById('statTotal').innerText = orders?.length || 0;
      document.getElementById('statPending').innerText = orders?.filter(o => o.status === 'pending').length || 0;
      document.getElementById('statRevenue').innerText = (orders?.reduce((sum, o) => sum + (parseFloat(o.price)||0), 0) || 0).toFixed(0) + ' ر.س';

      document.getElementById('ordersTableBody').innerHTML = orders?.slice(0, 10).map(o => `
        <tr class="border-b border-gray-800">
          <td class="p-2 font-bold">${o.customer_name}</td>
          <td class="p-2 text-green-400">${o.price} ر.س</td>
          <td class="p-2"><span class="px-2 py-0.5 rounded bg-gray-800 text-[10px]">${o.status}</span></td>
          <td class="p-2 text-gray-500">${new Date(o.created_at).toLocaleTimeString('ar-SA')}</td>
        </tr>
      `).join('') || '';
    }

    db.channel('admin').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => loadStats()).subscribe();
    loadStats();
  </script>
</body>
</html>

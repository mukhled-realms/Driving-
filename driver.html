<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberDelivery - لوحة المندوب (عبدالله)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .neon-border { box-shadow: 0 0 15px rgba(6, 182, 212, 0.3); border: 1px solid #06b6d4; }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">
  <div class="w-full max-w-lg">
    <!-- هيدر المندوب -->
    <div class="bg-slate-900 neon-border rounded-2xl p-5 mb-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-cyan-400">🛵 لوحة المندوب: عبدالله</h1>
        <p class="text-xs text-slate-400 mt-1">جاهز لاستلام وتوصيل الطلبات في الرياض</p>
      </div>
      <a href="tel:0571835254" class="bg-green-600 hover:bg-green-500 text-white px-3 py-2 rounded-lg text-sm font-bold transition-all">
        📞 اتصال سريع
      </a>
    </div>

    <!-- قائمة الطلبات الحية -->
    <div class="bg-slate-900 neon-border rounded-2xl p-5">
      <h2 class="text-lg font-semibold text-cyan-300 mb-4 border-b border-slate-800 pb-2">الطلبات الواردة</h2>
      <div id="ordersList" class="space-y-4">
        <div class="text-center text-slate-500 py-6">جاري تحميل الطلبات الحية...</div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    async function fetchOrders() {
      if (!db) return;
      const { data, error } = await db.from('orders').select('*').order('created_at', { ascending: false });
      
      const container = document.getElementById('ordersList');
      if (error) {
        container.innerHTML = `<div class="text-red-400 text-center">خطأ في جلب الطلبات: ${error.message}</div>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<div class="text-center text-slate-500 py-6">لا توجد طلبات جديدة حالياً</div>`;
        return;
      }

      container.innerHTML = data.map(order => `
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 transition-all">
          <div class="flex justify-between items-start mb-2">
            <div>
              <span class="text-xs bg-cyan-950 text-cyan-400 border border-cyan-800 px-2 py-0.5 rounded">${order.tracking_code}</span>
              <h3 class="font-bold text-lg text-white mt-1">${order.customer_name}</h3>
            </div>
            <span class="text-cyan-400 font-bold text-lg">${order.price} ر.س</span>
          </div>
          <p class="text-sm text-slate-300 mb-3">📍 ${order.address}</p>
          <div class="flex justify-between items-center text-xs text-slate-400 border-t border-slate-700 pt-3">
            <span>الحالة: <strong class="text-yellow-400">${order.status}</strong></span>
            <div class="space-x-2 space-x-reverse">
              <button onclick="updateStatus('${order.id}', 'in_transit')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded">بدء التوصيل</button>
              <button onclick="updateStatus('${order.id}', 'delivered')" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1 rounded">تم التسليم</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function updateStatus(id, status) {
      const { error } = await db.from('orders').update({ status: status, driver_name: CONFIG.DRIVER_CONTACT.NAME }).eq('id', id);
      if (error) {
        alert('فشل تحديث الحالة: ' + error.message);
      } else {
        fetchOrders();
      }
    }

    // تحديث تلقائي كل 5 ثوانٍ أو عند حدوث تغيير
    setInterval(fetchOrders, 5000);
    fetchOrders();
  </script>
</body>
</html>

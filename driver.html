<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver App | عبدالله</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    body { background: #05050a; color: #fff; font-family: 'Tajawal'; }
    .card { background: rgba(20,20,30,0.9); border: 1px solid #00f0ff; border-radius: 16px; padding: 1rem; margin-bottom: 1rem; }
  </style>
</head>
<body class="p-4 max-w-md mx-auto">

  <div class="flex justify-between items-center mb-6 bg-[#0b0f19] p-4 rounded-2xl border border-cyan-500/30">
    <div>
      <h1 class="text-xl font-black text-cyan-400">👋 أهلاً عبدالله</h1>
      <p class="text-xs text-gray-400">لوحة استقبال الطلبات الحية</p>
    </div>
    <span class="w-3 h-3 bg-green-400 rounded-full animate-ping"></span>
  </div>

  <div id="ordersList" class="space-y-4">
    <div class="text-center text-gray-500 mt-10">جاري تحميل الطلبات...</div>
  </div>

  <script>
    async function loadOrders() {
      const { data: orders } = await db.from('orders').select('*').in('status', ['pending', 'accepted', 'in_transit']).order('created_at', { ascending: false });
      const list = document.getElementById('ordersList');
      list.innerHTML = '';

      if (!orders || orders.length === 0) {
        list.innerHTML = '<div class="text-center text-gray-500 mt-12 text-gray-400">📭 لا توجد طلبات نشطة حالياً</div>';
        return;
      }

      orders.forEach(order => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div>
              <h3 class="font-bold text-lg text-white">${order.customer_name}</h3>
              <p class="text-xs text-gray-400 mt-1">📍 ${order.address}</p>
            </div>
            <span class="px-2 py-1 rounded-lg text-xs font-bold ${order.status === 'pending' ? 'bg-yellow-500/20 text-yellow-400' : 'bg-cyan-500/20 text-cyan-400'}">${order.status}</span>
          </div>
          <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-800">
            <div class="text-xl font-black text-green-400">${order.price} ر.س</div>
            <div class="flex gap-2">
              <a href="tel:${order.customer_phone}" class="bg-blue-600/20 text-blue-400 px-3 py-2 rounded-xl text-sm font-bold">📞 اتصال</a>
              ${order.status === 'pending' ? `<button onclick="updateStatus('${order.id}', 'accepted')" class="bg-green-500 text-black font-bold px-4 py-2 rounded-xl text-sm">قبول الطلب</button>` : `<button onclick="updateStatus('${order.id}', 'delivered')" class="bg-cyan-500 text-black font-bold px-4 py-2 rounded-xl text-sm">إنهاء وتوصيل</button>`}
            </div>
          </div>
        `;
        list.appendChild(div);
      });
    }

    async function updateStatus(id, newStatus) {
      await db.from('orders').update({ status: newStatus, driver_name: CONFIG.DRIVER_CONTACT.NAME, driver_phone: CONFIG.DRIVER_CONTACT.PHONE }).eq('id', id);
      loadOrders();
    }

    db.channel('driver-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => loadOrders())
      .subscribe();

    loadOrders();
  </script>
</body>
</html>

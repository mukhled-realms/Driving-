<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CyberDelivery | اطلب الآن</title>
  <meta name="theme-color" content="#05050a">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    body { background: #05050a; color: #e5e7eb; font-family: 'Tajawal', sans-serif; }
    .glass { background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 240, 255, 0.2); }
    .neon-text { text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }
    .btn-glow { box-shadow: 0 0 15px rgba(0, 255, 102, 0.4); transition: all 0.3s; }
    .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(0, 255, 102, 0.6); }
    #map { height: 240px; width: 100%; border-radius: 1rem; z-index: 1; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

  <!-- شريط الاتصال السريع المباشر لعبدالله أعلى الصفحة -->
  <div class="w-full max-w-md bg-emerald-950/90 border border-emerald-500/40 rounded-2xl p-3 mb-4 flex justify-between items-center text-sm shadow-lg">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></span>
      <span class="font-bold text-green-300">المندوب (عبدالله):</span>
      <span class="font-mono text-emerald-200">0571835254</span>
    </div>
    <div class="flex gap-2">
      <a href="tel:0571835254" class="bg-white text-emerald-950 px-3 py-1 rounded-xl text-xs font-black">📞 اتصال</a>
      <a href="https://wa.me/966571835254" target="_blank" class="bg-green-500 text-white px-3 py-1 rounded-xl text-xs font-black">💬 واتساب</a>
    </div>
  </div>

  <header class="w-full max-w-md glass rounded-2xl p-4 mb-4 flex justify-between items-center">
    <h1 class="text-2xl font-black neon-text text-cyan-400">🚀 <span data-i18n="app">سايبر توصيل</span></h1>
    <select id="langSelect" class="bg-black/50 border border-cyan-500/30 rounded-lg px-2 py-1 text-sm" onchange="changeLang(this.value)">
      <option value="ar">🇸🇦 عربي</option>
      <option value="en">🇬🇧 EN</option>
      <option value="ur">🇵🇰 اردو</option>
      <option value="bn">🇧🇩 বাংলা</option>
      <option value="hi">🇮🇳 हिंदी</option>
    </select>
  </header>

  <main class="w-full max-w-md space-y-4">
    <div class="glass rounded-2xl p-5 space-y-4">
      <h2 class="text-xl font-bold text-green-400" data-i18n="order">طلب جديد</h2>
      
      <input type="text" id="custName" placeholder="اسم العميل *" class="w-full bg-black/40 border border-gray-700 rounded-xl p-3 focus:border-cyan-400 outline-none">
      <input type="tel" id="custPhone" placeholder="رقم الجوال" class="w-full bg-black/40 border border-gray-700 rounded-xl p-3 focus:border-cyan-400 outline-none">
      
      <div id="map"></div>
      <textarea id="address" rows="2" placeholder="عنوان التوصيل بالتفصيل *" class="w-full bg-black/40 border border-gray-700 rounded-xl p-3 focus:border-cyan-400 outline-none"></textarea>
      
      <div class="grid grid-cols-2 gap-3">
        <input type="number" id="amount" placeholder="قيمة الطلب (ر.س) *" class="bg-black/40 border border-gray-700 rounded-xl p-3 text-center font-bold text-green-400 text-xl">
        <input type="text" id="notes" placeholder="ملاحظات اختيارية" class="bg-black/40 border border-gray-700 rounded-xl p-3">
      </div>

      <button onclick="submitOrder()" id="submitBtn" class="w-full btn-glow bg-gradient-to-r from-cyan-500 to-green-500 text-black font-black py-4 rounded-xl text-lg">
        🚀 إرسال الطلب للمندوب
      </button>
    </div>
  </main>

  <script>
    let map, marker;
    function initMap() {
      map = L.map('map').setView([CONFIG.MAP_DEFAULT.lat, CONFIG.MAP_DEFAULT.lng], 13);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
      map.on('click', function(e) {
        if (marker) map.removeLayer(marker);
        marker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(map);
        document.getElementById('address').value = `موقع محدد: ${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;
      });
    }

    async function submitOrder() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('address').value.trim();
      const amount = document.getElementById('amount').value.trim();
      
      if(!name || !address || !amount) { alert('⚠️ يرجى تعبئة الحقول الأساسية'); return; }

      const { data, error } = await db.from('orders').insert([{
        customer_name: name,
        customer_phone: phone,
        address: address,
        price: parseFloat(amount),
        status: 'pending',
        notes: document.getElementById('notes').value
      }]).select().single();

      if(error) alert('❌ حدث خطأ: ' + error.message);
      else {
        alert(`✅ تم إنشاء الطلب بنجاح!\nرمز التتبع: ${data.tracking_code}`);
        window.location.href = `track.html?order=${data.tracking_code}`;
      }
    }

    function changeLang(lang) {
      document.documentElement.lang = lang;
      document.documentElement.dir = CONFIG.LANGUAGES[lang].dir;
      document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n'), lang));
    }

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      if(navigator.serviceWorker) navigator.serviceWorker.register('sw.js');
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberDelivery - طلب جديد</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .neon-border { box-shadow: 0 0 15px rgba(6, 182, 212, 0.5); border: 1px solid #06b6d4; }
    .neon-glow { text-shadow: 0 0 10px rgba(6, 182, 212, 0.8); }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">
  <div class="w-full max-w-md bg-slate-900 neon-border rounded-2xl p-6 shadow-2xl">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-cyan-400 neon-glow">⚡ سايبر توصيل</h1>
      <select id="langSelect" onchange="changeLang(this.value)" class="bg-slate-800 border border-cyan-500 text-sm rounded px-2 py-1 text-cyan-300">
        <option value="ar">🇸🇦 عربى</option>
        <option value="en">🇬🇧 English</option>
        <option value="ur">🇵🇰 اردو</option>
        <option value="bn">🇧🇩 বাংলা</option>
        <option value="hi">🇮🇳 हिंदी</option>
      </select>
    </div>

    <!-- كتاولوغ المنتجات السريع -->
    <div class="mb-4">
      <label class="block text-sm text-cyan-300 mb-2 font-semibold">اختر المنتج أو الوجبة:</label>
      <div id="productsGrid" class="grid grid-cols-2 gap-2 mb-4">
        <!-- يتم تعبئتها ديناميكياً أو يدوياً بأسعار وواضحة -->
        <div onclick="selectProduct('وجبة سايبر الخاصة', 45)" class="bg-slate-800 border border-slate-700 p-2 rounded-lg cursor-pointer hover:border-cyan-400 text-center">
          <div class="text-xs text-slate-300 mb-1">وجبة سايبر</div>
          <div class="text-cyan-400 font-bold">45 ر.س</div>
        </div>
        <div onclick="selectProduct('مشويات ديلوكس', 65)" class="bg-slate-800 border border-slate-700 p-2 rounded-lg cursor-pointer hover:border-cyan-400 text-center">
          <div class="text-xs text-slate-300 mb-1">مشويات ديلوكس</div>
          <div class="text-cyan-400 font-bold">65 ر.س</div>
        </div>
      </div>
    </div>

    <!-- نموذج الطلب -->
    <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-300 mb-1">اسم العميل:</label>
        <input type="text" id="cName" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white focus:border-cyan-400 outline-none">
      </div>
      <div>
        <label class="block text-sm text-slate-300 mb-1">رقم الجوال:</label>
        <input type="tel" id="cPhone" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white focus:border-cyan-400 outline-none">
      </div>
      <div>
        <label class="block text-sm text-slate-300 mb-1">العنوان بالتفصيل (الرياض):</label>
        <textarea id="cAddress" required rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white focus:border-cyan-400 outline-none"></textarea>
      </div>
      <div class="flex justify-between items-center bg-slate-800 p-3 rounded-lg border border-slate-700">
        <span class="text-slate-300">الإجمالي:</span>
        <span id="cPriceDisplay" class="text-xl font-bold text-cyan-400">0.00 ر.س</span>
        <input type="hidden" id="cPrice" value="0">
      </div>
      <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold py-3 rounded-lg transition-all shadow-lg shadow-cyan-500/30">
        إرسال الطلب الفوري 🚀
      </button>
    </form>
  </div>

  <script src="config.js"></script>
  <script>
    let currentLang = 'ar';
    function selectProduct(name, price) {
      document.getElementById('cName').value = name;
      document.getElementById('cPrice').value = price;
      document.getElementById('cPriceDisplay').innerText = price + ' ر.س';
    }
    function changeLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = CONFIG.LANGUAGES[lang].dir;
    }
    async function submitOrder(e) {
      e.preventDefault();
      const name = document.getElementById('cName').value;
      const phone = document.getElementById('cPhone').value;
      const address = document.getElementById('cAddress').value;
      const price = parseFloat(document.getElementById('cPrice').value);

      if (!db) {
        alert('خطأ في الاتصال بقاعدة البيانات');
        return;
      }

      const { data, error } = await db.from('orders').insert([
        { customer_name: name, customer_phone: phone, address: address, price: price, status: 'pending' }
      ]).select();

      if (error) {
        alert('حدث خطأ: ' + error.message);
      } else {
        alert('تم إرسال طلبك بنجاح! كود التتبع: ' + data[0].tracking_code);
        window.location.href = `track.html?code=${data[0].tracking_code}`;
      }
    }
  </script>
</body>
</html>

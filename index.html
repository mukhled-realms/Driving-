<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberDelivery | لوحة المطعم - إرسال وتتبع الطلبات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        
        .animate-slide-in { animation: slideIn 0.3s ease-out; }
        .pulse-success { animation: pulse-ring 2s infinite; }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-accepted { background: #dbeafe; color: #1e40af; }
        .status-at-store { background: #fce7f3; color: #9f1239; }
        .status-delivered { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body class="p-4">

    <!-- Header -->
    <div class="max-w-4xl mx-auto">
        <div class="text-center mb-8 text-white">
            <div class="inline-block bg-white/10 backdrop-blur-sm rounded-2xl px-6 py-3 mb-4">
                <h1 class="text-4xl font-black mb-2">🏪 لوحة المطعم</h1>
                <p class="text-white/90">أرسل طلباتك وتتبع المندوبين مباشرة</p>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="grid md:grid-cols-2 gap-6">
            
            <!-- LEFT: Order Form -->
            <div class="bg-white rounded-3xl shadow-2xl border border-white/20 p-6 backdrop-blur-sm">
                <h2 class="text-2xl font-black text-gray-800 mb-6 flex items-center gap-2">
                    <span class="w-10 h-10 bg-emerald-100 rounded-xl flex items-center justify-center">📦</span>
                    إرسال طلب جديد
                </h2>
                
                <div class="space-y-4">
                    <!-- Customer Name -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">اسم العميل / رقم الطلب</label>
                        <input type="text" id="custName" placeholder="مثال: طلب رقم 1234" class="w-full bg-gray-50 border-2 border-gray-200 p-3 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                    </div>

                    <!-- Phone -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">رقم الجوال (اختياري)</label>
                        <input type="tel" id="custPhone" placeholder="05xxxxxxxx" class="w-full bg-gray-50 border-2 border-gray-200 p-3 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                    </div>

                    <!-- Address -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">عنوان التوصيل التفصيلي</label>
                        <textarea id="custAddress" rows="2" placeholder="الحي، الشارع، رقم المبنى، علامة مميزة..." class="w-full bg-gray-50 border-2 border-gray-200 p-3 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition resize-none"></textarea>
                    </div>

                    <!-- Price -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">قيمة الطلب (بالريال)</label>
                        <input type="number" id="orderPrice" placeholder="50" class="w-full bg-gray-50 border-2 border-gray-200 p-3 rounded-xl text-2xl font-black text-emerald-600 focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                    </div>

                    <!-- Delivery Fee -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">رسوم التوصيل (بالريال)</label>
                        <input type="number" id="deliveryFee" value="10" class="w-full bg-gray-50 border-2 border-gray-200 p-3 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                    </div>

                    <!-- Notes -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">ملاحظات (اختياري)</label>
                        <input type="text" id="orderNotes" placeholder="مثال: الدور الثالث، اتصل قبل الوصول" class="w-full bg-gray-50 border-2 border-gray-200 p-3 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition">
                    </div>

                    <!-- Submit Button -->
                    <button onclick="sendOrderToDriver()" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black text-lg py-4 rounded-xl shadow-lg shadow-emerald-200 transition active:scale-95 mt-4 pulse-success">
                        🚀 إرسال الطلب للمندوب
                    </button>

                    <!-- Status Message -->
                    <div id="statusMsg" class="hidden text-center p-3 rounded-xl text-sm font-bold mt-4"></div>
                </div>
            </div>

            <!-- RIGHT: Live Orders & Stats -->
            <div class="space-y-6">
                
                <!-- Stats Cards -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white rounded-2xl shadow-xl p-4 border border-white/20">
                        <div class="text-gray-500 text-sm mb-1">إجمالي اليوم</div>
                        <div class="text-2xl font-black text-gray-800" id="todayTotal">0</div>
                        <div class="text-xs text-gray-400 mt-1">طلب</div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-xl p-4 border border-white/20">
                        <div class="text-gray-500 text-sm mb-1">الكاش المحصل</div>
                        <div class="text-2xl font-black text-emerald-600" id="cashCollected">0</div>
                        <div class="text-xs text-gray-400 mt-1">ريال</div>
                    </div>
                </div>

                <!-- Active Orders List -->
                <div class="bg-white rounded-3xl shadow-2xl border border-white/20 p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-black text-gray-800 flex items-center gap-2">
                            <span class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center">📋</span>
                            الطلبات النشطة
                        </h2>
                        <button onclick="refreshOrders()" class="text-sm text-blue-600 hover:text-blue-700 font-bold">
                            🔄 تحديث
                        </button>
                    </div>
                    
                    <div id="ordersList" class="space-y-3 max-h-96 overflow-y-auto">
                        <div class="text-center text-gray-400 py-8">
                            <div class="text-4xl mb-2">📭</div>
                            <p>لا توجد طلبات نشطة</p>
                        </div>
                    </div>
                </div>

                <!-- Invite Driver Button -->
                <button onclick="shareApp()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-black text-lg py-4 rounded-xl shadow-lg transition active:scale-95 hover:from-purple-500 hover:to-pink-500">
                    🤝 ادعُ مندوباً جديداً للشبكة
                </button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // إعداد الاتصال بقاعدة البيانات
        // ============================================
        const SUPABASE_URL = 'https://hhljyqelqnsltmasxgqv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Xeo54iI9kxJ0n00f71A_yA_QNvmRC3H';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ============================================
        // إرسال الطلب للمندوب
        // ============================================
        async function sendOrderToDriver() {
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusMsg');
            
            // جمع البيانات
            const customerName = document.getElementById('custName').value.trim();
            const customerPhone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const price = parseFloat(document.getElementById('orderPrice').value);
            const deliveryFee = parseFloat(document.getElementById('deliveryFee').value) || 10;
            const notes = document.getElementById('orderNotes').value.trim();

            // التحقق من البيانات
            if (!customerName || !address || !price || price <= 0) {
                showStatus('⚠️ يرجى ملء جميع الحقول المطلوبة بشكل صحيح', 'error');
                return;
            }

            // تغيير حالة الزر
            btn.innerHTML = '⏳ جاري الإرسال...';
            btn.disabled = true;
            btn.classList.remove('pulse-success');

            // الإرسال إلى Supabase
            const { data, error } = await supabaseClient
                .from('orders')
                .insert([
                    { 
                        customer_name: customerName,
                        customer_phone: customerPhone || null,
                        address: address, 
                        price: price,
                        delivery_fee: deliveryFee,
                        notes: notes || null,
                        status: 'pending',
                        created_at: new Date().toISOString(),
                        restaurant_id: getRestaurantId()
                    }
                ])
                .select();

            if (error) {
                console.error('Error:', error);
                showStatus('❌ فشل الإرسال، تأكد من اتصالك بالإنترنت', 'error');
                btn.innerHTML = '🚀 إرسال الطلب للمندوب';
                btn.disabled = false;
                btn.classList.add('pulse-success');
            } else {
                showStatus('✅ تم إرسال الطلب بنجاح! المندوب سيستلم الإشعار الآن', 'success');
                btn.innerHTML = '✅ تم الإرسال!';
                btn.classList.replace('bg-emerald-600', 'bg-gray-800');
                
                // مسح الحقول
                document.getElementById('custName').value = '';
                document.getElementById('custPhone').value = '';
                document.getElementById('custAddress').value = '';
                document.getElementById('orderPrice').value = '';
                document.getElementById('orderNotes').value = '';
                
                // تحديث قائمة الطلبات
                setTimeout(() => {
                    loadActiveOrders();
                    btn.innerHTML = '🚀 إرسال الطلب للمندوب';
                    btn.classList.replace('bg-gray-800', 'bg-emerald-600');
                    btn.disabled = false;
                    btn.classList.add('pulse-success');
                }, 2000);
            }
        }

        // ============================================
        // تحميل الطلبات النشطة
        // ============================================
        async function loadActiveOrders() {
            const ordersList = document.getElementById('ordersList');
            
            const { data: orders, error } = await supabaseClient
                .from('orders')
                .select('*')
                .eq('restaurant_id', getRestaurantId())
                .in('status', ['pending', 'accepted', 'at_store'])
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error loading orders:', error);
                return;
            }

            if (orders.length === 0) {
                ordersList.innerHTML = `
                    <div class="text-center text-gray-400 py-8">
                        <div class="text-4xl mb-2">📭</div>
                        <p>لا توجد طلبات نشطة</p>
                    </div>
                `;
                return;
            }

            ordersList.innerHTML = orders.map(order => createOrderCard(order)).join('');
            updateStats();
        }

        // ============================================
        // إنشاء بطاقة الطلب
        // ============================================
        function createOrderCard(order) {
            const statusText = {
                'pending': 'في الانتظار',
                'accepted': 'تم القبول',
                'at_store': 'في المحل',
                'delivered': 'تم التوصيل'
            };
            
            const statusClass = {
                'pending': 'status-pending',
                'accepted': 'status-accepted',
                'at_store': 'status-at-store',
                'delivered': 'status-delivered'
            };

            const timeAgo = getTimeAgo(order.created_at);
            
            return `
                <div class="bg-gray-50 border-2 border-gray-200 rounded-xl p-4 animate-slide-in hover:border-emerald-500 transition">
                    <div class="flex items-start justify-between mb-2">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-black text-gray-800">#${order.id}</span>
                                <span class="status-badge ${statusClass[order.status]}">${statusText[order.status]}</span>
                            </div>
                            <div class="text-sm text-gray-600 font-bold">${order.customer_name}</div>
                        </div>
                        <div class="text-left">
                            <div class="text-2xl font-black text-emerald-600">${order.price} ر.س</div>
                            <div class="text-xs text-gray-400">${timeAgo}</div>
                        </div>
                    </div>
                    <div class="text-xs text-gray-500 mb-2">
                        📍 ${order.address}
                    </div>
                    ${order.driver_name ? `
                        <div class="text-xs text-blue-600 font-bold mt-2">
                            🚗 المندوب: ${order.driver_name}
                        </div>
                    ` : ''}
                    ${order.notes ? `
                        <div class="text-xs text-gray-500 mt-2 italic">
                            💬 ${order.notes}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // ============================================
        // تحديث الإحصائيات
        // ============================================
        async function updateStats() {
            const today = new Date().toISOString().split('T')[0];
            
            // إجمالي طلبات اليوم
            const { count: todayCount } = await supabaseClient
                .from('orders')
                .select('*', { count: 'exact', head: true })
                .eq('restaurant_id', getRestaurantId())
                .gte('created_at', today);

            document.getElementById('todayTotal').textContent = todayCount || 0;

            // الكاش المحصل اليوم
            const { data: deliveredOrders } = await supabaseClient
                .from('orders')
                .select('price')
                .eq('restaurant_id', getRestaurantId())
                .eq('status', 'delivered')
                .gte('created_at', today);

            const totalCash = deliveredOrders ? deliveredOrders.reduce((sum, order) => sum + order.price, 0) : 0;
            document.getElementById('cashCollected').textContent = totalCash.toLocaleString('ar-SA');
        }

        // ============================================
        // تحديث الطلبات
        // ============================================
        function refreshOrders() {
            loadActiveOrders();
            showStatus('🔄 تم تحديث القائمة', 'info');
        }

        // ============================================
        // مشاركة التطبيق
        // ============================================
        function shareApp() {
            const appUrl = window.location.href.replace('restaurant', 'driver');
            const message = `انضم إلى شبكة توصيل CyberDelivery - نظام ذكي لإدارة الطلبات والكاش! ${appUrl}`;
            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        // ============================================
        // دوال مساعدة
        // ============================================
        function showStatus(message, type) {
            const status = document.getElementById('statusMsg');
            status.classList.remove('hidden');
            status.innerText = message;
            
            if (type === 'error') {
                status.className = 'text-center p-3 rounded-xl text-sm font-bold mt-4 bg-red-100 text-red-700 border-2 border-red-300';
            } else if (type === 'success') {
                status.className = 'text-center p-3 rounded-xl text-sm font-bold mt-4 bg-emerald-100 text-emerald-800 border-2 border-emerald-300';
            } else {
                status.className = 'text-center p-3 rounded-xl text-sm font-bold mt-4 bg-blue-100 text-blue-700 border-2 border-blue-300';
            }
            
            setTimeout(() => {
                status.classList.add('hidden');
            }, 4000);
        }

        function getRestaurantId() {
            let id = localStorage.getItem('restaurantId');
            if (!id) {
                id = 'restaurant_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('restaurantId', id);
            }
            return id;
        }

        function getTimeAgo(timestamp) {
            const now = new Date();
            const then = new Date(timestamp);
            const diff = Math.floor((now - then) / 1000);
            
            if (diff < 60) return 'الآن';
            if (diff < 3600) return `منذ ${Math.floor(diff / 60)} دقيقة`;
            if (diff < 86400) return `منذ ${Math.floor(diff / 3600)} ساعة`;
            return `منذ ${Math.floor(diff / 86400)} يوم`;
        }

        // ============================================
        // التحديث التلقائي كل 10 ثواني
        // ============================================
        setInterval(loadActiveOrders, 10000);

        // ============================================
        // التهيئة عند تحميل الصفحة
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            loadActiveOrders();
            getRestaurantId(); // إنشاء ID للمطعم
        });
    </script>
</body>
</html>

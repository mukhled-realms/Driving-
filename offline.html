<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberDelivery - وضع عدم الاتصال</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center text-center">
  <div class="w-full max-w-md bg-slate-900 border border-cyan-500 rounded-2xl p-6 shadow-2xl">
    <div class="text-4xl mb-4">⚠️</div>
    <h1 class="text-xl font-bold text-cyan-400 mb-2">لا يوجد اتصال بالإنترنت</h1>
    <p class="text-sm text-slate-400 mb-6">النظام يعمل في وضع الأمان المحلي. سيتم مزامنة بياناتك وعملياتك فور عودة الشبكة تلقائياً.</p>
    <button onclick="window.location.reload()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold py-2.5 rounded-lg transition-all">
      إعادة المحاولة 🔄
    </button>
  </div>
</body>
</html>
